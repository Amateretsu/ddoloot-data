# Value maps applied by coercers. Keys match lowercased, whitespace-normalised text.
# The three maps below are the whole file; an unknown key is rejected at load.

# Wiki binding text -> spec binding enum. `on_equip` means "undecided until equipped".
binding:
  "bound to account on acquire": account
  "bound to account on acquire , exclusive": account
  "bound to character on acquire": character
  "bound to account on equip": on_equip
  "bound to character on equip": on_equip
  "unbound": unbound

damage_types:
  slash: Slashing
  bludgeon: Bludgeoning
  pierce: Piercing
  magic: Magic
  force: Force

denominations: {pp: 1000, gp: 100, sp: 10, cp: 1}
