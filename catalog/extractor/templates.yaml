# Item page templates. The first rule that matches wins; order matters.
#
# detect.first_label:    the label of the first infobox row.
# detect.has_label:      a label that must be present.
# detect.default:        matches every page; the last template must be the default.
# category:              fixed category, or category_from to derive it from part `index`
#                        of a field split on every separator in `split` (then looked up
#                        in category_map).
# item_type_from:        output path holding the value to promote to item_type, or
#                        item_type_from_split to take one part of a split field.
# item_type_from_category: wiki category → item_type, used only when no type row gave
#                        one; the first listed category the page is in wins.
# equip_slots:           fixed slots, or equip_slots_from to derive them from every part
#                        of a split field.
# Unknown keys are rejected when the config loads.
templates:
  - id: weapon
    detect: {first_label: [proficiency class]}
    category: weapon
    item_type_from: weapon_stats.weapon_type
    equip_slots: [main_hand]

  - id: armor
    detect: {first_label: [armor type]}
    category: armor
    item_type_from: armor_stats.armor_type
    equip_slots: [body]

  - id: shield
    detect: {first_label: [shield type]}
    category: shield
    item_type_from: shield_stats.shield_type
    equip_slots: [off_hand]

  - id: accessory
    detect: {has_label: [item type]}
    category_from: {field: item_type, split: [" / "], index: 0}
    item_type_from_split: {field: item_type, split: [" / "], index: 1}
    equip_slots_from: {field: slot, split: [",", " or "]}

  - id: accessory_untyped
    detect: {default: true}
    category: other
    # Maintainer decision 4g: no row names these types, so the wiki category does.
    item_type_from_category:
      Named wands: Wand
      Rune Arms: Rune Arm
    equip_slots: []

# Maps the first segment of a wiki item type to a spec category.
category_map:
  jewelry: jewelry
  clothing: clothing
  weapon: weapon
  armor: armor
  shield: shield
